<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary Meta Tags -->
    <title>Originn | Build Websites & Digital Presence</title>
    <meta name="description" content="Originn helps businesses and individuals build professional websites, portfolios, and digital presence that drives growth and credibility." />
    <meta name="keywords" content="website development, portfolio website, digital presence, personal branding, business website" />

    <!-- Canonical Tag -->
    <link rel="canonical" href="https://www.originn.online/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.originn.online" />
    <meta property="og:title" content="Originn | Build Websites & Digital Presence" />
    <meta property="og:description" content="Build your website and digital presence with Originn" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Originn | Build Websites & Digital Presence" />
    <meta property="twitter:description" content="Build your website and portfolio with Originn" />
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('originn-theme');
          if (localTheme === 'light') {
            document.documentElement.classList.add('light-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
